[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cine-match"
version = "1.0.0"
description = "An explainable hybrid movie recommender for a CODTECH internship"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.1,<3", "scipy>=1.14,<2", "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]
analysis = ["matplotlib>=3.9,<4"]

[project.scripts]
cinematch = "cinematch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

